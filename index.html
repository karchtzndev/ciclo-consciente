<script>
/* ==========================================================
   CAPTURADOR DE ERROS (carrega antes de tudo)
   Guarda toda falha em window.__ERROR_LOG__ para a aba Erros.
   ========================================================== */
(function(){
  var MAX = 120;
  var log = [];
  window.__ERROR_LOG__ = log;
  window.__ERROR_LISTENERS__ = [];

  function notify(){
    try{ (window.__ERROR_LISTENERS__||[]).forEach(function(f){ f(); }); }catch(e){}
  }

  function push(type, msg, detail){
    try{
      var entry = {
        t: new Date().toISOString(),
        type: type,
        msg: String(msg == null ? '' : msg).slice(0, 1200),
        detail: detail ? String(detail).slice(0, 2500) : ''
      };
      // evita spam do mesmo erro repetido em sequência
      var last = log[log.length-1];
      if(last && last.type===entry.type && last.msg===entry.msg){
        last.count = (last.count||1)+1;
        last.t = entry.t;
      } else {
        log.push(entry);
        if(log.length > MAX) log.shift();
      }
      notify();
    }catch(e){}
  }
  window.__LOG_ERROR__ = push;

  // 1. Erros de JavaScript não capturados
  window.addEventListener('error', function(ev){
    if(ev && ev.target && ev.target !== window && (ev.target.src || ev.target.href)){
      push('recurso', 'Falha ao carregar: ' + (ev.target.src || ev.target.href), ev.target.tagName);
      return;
    }
    var st = ev && ev.error && ev.error.stack ? ev.error.stack : '';
    var where = (ev && ev.filename ? ev.filename.split('/').pop() : '') + (ev && ev.lineno ? ':' + ev.lineno + ':' + ev.colno : '');
    push('js', (ev && ev.message) || 'Erro desconhecido', (where ? where + '\n' : '') + st);
  }, true);

  // 2. Promises rejeitadas (Firebase, fetch, etc)
  window.addEventListener('unhandledrejection', function(ev){
    var r = ev && ev.reason;
    var msg = r && r.message ? r.message : String(r);
    var extra = '';
    if(r && r.code) extra += 'code: ' + r.code + '\n';
    if(r && r.stack) extra += r.stack;
    push('promise', msg, extra);
  });

  // 3. console.error e console.warn
  // Ruído interno conhecido do Firestore: reconexão de stream ao voltar de
  // segundo plano (comum no Safari/iOS) e aviso de depreciação de API.
  // Continuam aparecendo no console do navegador normalmente — só não
  // entram no relatório da aba Erros, pra não afogar problema real em
  // aviso já confirmado inofensivo.
  var KNOWN_NOISE = [
    /WebChannelConnection RPC 'Listen' stream .* transport errored/,
    /enableMultiTabIndexedDbPersistence\(\) will be deprecated/
  ];
  function isKnownNoise(msg){
    return KNOWN_NOISE.some(function(re){ return re.test(msg); });
  }

  ['error','warn'].forEach(function(lvl){
    var orig = console[lvl];
    console[lvl] = function(){
      try{
        var parts = Array.prototype.slice.call(arguments).map(function(a){
          if(a instanceof Error) return a.message + (a.stack ? '\n' + a.stack : '');
          if(typeof a === 'object'){ try{ return JSON.stringify(a); }catch(e){ return String(a); } }
          return String(a);
        });
        var joined = parts.join(' ');
        if(!isKnownNoise(joined)) push('console.' + lvl, joined, '');
      }catch(e){}
      return orig.apply(console, arguments);
    };
  });

  // 4. Informações do ambiente (primeira linha do relatório)
  window.__ENV_INFO__ = function(){
    var n = navigator;
    return [
      'App: Ciclo Consciente',
      'Versão publicada: ' + (window.__BUILD__ || 'desconhecida'),
      'URL: ' + location.href,
      'Data: ' + new Date().toString(),
      'Navegador: ' + n.userAgent,
      'Idioma: ' + n.language,
      'Tela: ' + screen.width + 'x' + screen.height + ' (janela ' + innerWidth + 'x' + innerHeight + ')',
      'Online: ' + (n.onLine ? 'sim' : 'não'),
      'Service Worker: ' + ('serviceWorker' in n ? 'suportado' : 'não suportado')
    ].join('\n');
  };
})();

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------------
     CONSTANTS / VOCABULÁRIO DO MÉTODO
  --------------------------------------------------------------------- */
  const MUCUS_OPTIONS = [
    { id:'nenhum',   label:'Nenhum', hint:'Ausência de muco perceptível' },
    { id:'pegajoso', label:'Pegajoso, opaco', hint:'Consistência grumosa, esbranquiçada' },
    { id:'cremoso',  label:'Cremoso', hint:'Leitoso, mais fluido' },

  const SENSACAO_OPTIONS = [
    { id:'seca', label:'Seca' },
    { id:'umida', label:'Úmida' },
    { id:'molhada', label:'Molhada' },
    { id:'lubrificativa', label:'Lubrificativa / Escorregadia' },

  const SANGRAMENTO_OPTIONS = [
    { id:'nenhum', label:'Nenhum' },
    { id:'leve', label:'Leve / Spotting' },
    { id:'menstruacao', label:'Menstruação' },
  ];
  const FATORES_OPTIONS = [
    { id:'relacao', label:'Relação sexual' },
    { id:'estresse', label:'Estresse' },
    { id:'amamentacao', label:'Amamentação' },
    { id:'medicamento', label:'Medicamento / Hormônio' },
    { id:'higiene', label:'Ducha / Produto íntimo' },
    { id:'infeccao', label:'Possível infecção' },
  ];

  const PREMIUM_FEATURES = [
    'Gráfico e calendário Billings completo, com simbologia clássica',
    'Identificação automática do Ápice e da Regra dos 3 dias',
    'Histórico ilimitado de ciclos',
    'Algoritmo de probabilidade de fertilidade do dia',
    'Exportação de relatório em PDF para sua instrutora ou médico(a)',
    'Conteúdo aprofundado sobre regras de espaçamento gestacional',
  ];
  const REPRODUCTIVE_PHASES = [
    { id:'normal', label:'Ciclos regulares', hint:'Regras padrão do método.' },
    { id:'amamentacao', label:'Amamentação / Pós-parto', hint:'Permite marcar seu Padrão Básico Pessoal.' },
    { id:'perimenopausa', label:'Perimenopausa', hint:'Permite marcar seu Padrão Básico Pessoal.' },
    { id:'irregular', label:'Ciclos longos ou irregulares', hint:'Maior cautela nas classificações intermediárias.' },
  ];

  /* ---------------------------------------------------------------------
     UTILITÁRIOS
  --------------------------------------------------------------------- */
  const pad = n => String(n).padStart(2,'0');
  const uid = () => 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const addDays = (dateStr, n) => { const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const dayDiff = (a,b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
  const fmtBR = (dateStr) => { const [y,m,d]=dateStr.split('-'); return `${d}/${m}`; };
  const fmtBRFull = (dateStr) => { const [y,m,d]=dateStr.split('-'); return `${d}/${m}/${y}`; };
  const label = (arr,id) => (arr.find(o=>o.id===id)||{}).label || '—';
  const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function icon(name, cls){
    cls = cls || 'w-5 h-5';
    const paths = {
      home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1v-9"/>',
      edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4.2 1L4 15.8 16.5 3.5Z"/>',
      chart: '<path d="M4 20V11"/><path d="M12 20V4"/><path d="M20 20v-7"/>',
      user: '<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4.1 3.4-6.4 7.5-6.4S19.5 15.9 19.5 20"/>',
      lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7.6a4 4 0 0 1 8 0V11"/>',
      eye: '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
      eyeOff: '<path d="M10.7 6.2A9.6 9.6 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3.2 4M6.3 7.8A16.7 16.7 0 0 0 2 12s3.6 6.5 10 6.5c1.6 0 3-.4 4.2-1M4 4l16 16"/>',
      check: '<path d="M4 12.5 9.5 18 20 6"/>',
      x: '<path d="M6 6l12 12M18 6 6 18"/>',
      bug: '<path d="M8 6a4 4 0 0 1 8 0"/><rect x="7" y="8" width="10" height="11" rx="5"/><path d="M7 12H3M21 12h-4M7.5 16.5 4 18.5M16.5 16.5 20 18.5M7.5 9.5 4 7.5M16.5 9.5 20 7.5"/>',
      copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
      share: '<path d="M12 3v13"/><path d="m8 7 4-4 4 4"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
      chevron: '<path d="M9 6l6 6-6 6"/>',
      drop: '<path d="M12 3.5c3.6 4.4 6.5 8.1 6.5 11.4A6.5 6.5 0 1 1 5.5 14.9C5.5 11.6 8.4 7.9 12 3.5Z"/>',
      download: '<path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/>',
      book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/>',
      sparkle: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>',
      shield: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/>',
      logout: '<path d="M9 20H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h4"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>',
      bell: '<path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6.5H4c.5-1 2-2.5 2-6.5Z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
      trash: '<path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>',
      card: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/>',
      alert: '<path d="M12 8v5"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/>',
    };
    return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]||''}</svg>`;
  }

  /* ---------------------------------------------------------------------
     PERSISTÊNCIA (Firebase Auth + Firestore)
     Cada usuária só enxerga seus próprios dados:
       users/{uid}                  -> perfil (nome, e-mail, plano)
       users/{uid}/records/{date}   -> um registro diário por data
     O isolamento é garantido pelas Regras de Segurança do Firestore
     (ver firestore.rules), não apenas pelo código do app.
  --------------------------------------------------------------------- */
  const isFirebaseConfigured = !!(window.__FIREBASE_CONFIG__ && window.__FIREBASE_CONFIG__.apiKey && window.__FIREBASE_CONFIG__.apiKey !== 'SUA_API_KEY_AQUI');

  let fbApp = null, auth = null, db = null;
  let userDocUnsub = null, recordsUnsub = null, suggestionsUnsub = null;
  const isAppCheckConfigured = !!(window.__APPCHECK_SITE_KEY__ && window.__APPCHECK_SITE_KEY__ !== 'SUA_CHAVE_RECAPTCHA_V3_AQUI');

  if(isFirebaseConfigured){
    fbApp = firebase.initializeApp(window.__FIREBASE_CONFIG__);
    auth = firebase.auth();
    db = firebase.firestore();
    // Cache local (IndexedDB): permite registrar offline — a escrita fica
    // pendente no dispositivo e sincroniza sozinha quando a conexão volta.
    db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
      // 'failed-precondition' = múltiplas abas sem synchronizeTabs (não é o caso aqui);
      // 'unimplemented' = navegador sem suporte (ex.: modo privado de alguns navegadores).
      console.warn('Persistência offline indisponível:', err.code);
    });
    // App Check: garante que só o app de verdade (não um script/bot externo)
    // consegue chamar a Cloud Function pública getSharedChart.
    if(isAppCheckConfigured){
      try{
        firebase.appCheck().activate(
          new firebase.appCheck.ReCaptchaV3Provider(window.__APPCHECK_SITE_KEY__),
          true // auto-renovação de token
        );
      }catch(e){ console.warn('App Check indisponível:', e); }
    }
  }

  // Indicador de conectividade — usado para avisar quando o dispositivo está offline.
  let isOnline = navigator.onLine;
  window.addEventListener('online', () => { isOnline = true; render(); });
  window.addEventListener('offline', () => { isOnline = false; render(); });

  function detachListeners(){
    if(userDocUnsub){ userDocUnsub(); userDocUnsub = null; }
    if(recordsUnsub){ recordsUnsub(); recordsUnsub = null; }
    if(suggestionsUnsub){ suggestionsUnsub(); suggestionsUnsub = null; }
  }

  // Sugestões do esposo em tempo real. Antes isso era uma leitura única no
  // login: se ela já estivesse com o app aberto, a sugestão só aparecia
  // depois de recarregar a página — e ela não achava onde aprovar.
  function attachSuggestionsListener(uidVal){
    if(suggestionsUnsub) return;
    suggestionsUnsub = db.collection('users').doc(uidVal).collection('suggestions')
      .orderBy('date','desc').limit(20)
      .onSnapshot(snap=>{
        state.suggestions = snap.docs.map(d=>({ id:d.id, ...d.data() }));
        render();
      }, err => {
        console.error('suggestions listener:', err);
        state.suggestions = [];
      });
  }

  function attachUserDocListener(fbUser){
    userDocUnsub = db.collection('users').doc(fbUser.uid).onSnapshot(snap=>{
      state.currentUser = snap.exists
        ? { id: fbUser.uid, email: fbUser.email || '', ...snap.data() }
        : { id: fbUser.uid, email: fbUser.email || '', name: (fbUser.email||'Usuária').split('@')[0], plan:'free' };
      if(state.showOnboarding===null){
        state.showOnboarding = !state.currentUser.onboardingSeen && state.currentUser.role==='aluna' && !state.currentUser.isGuest;
      }
      render();
    }, err => console.error('users listener:', err));
  }

  function attachRecordsListener(uidVal){
    recordsUnsub = db.collection('users').doc(uidVal).collection('records').orderBy('date','asc').onSnapshot(snap=>{
      state.records = snap.docs.map(d=>d.data());
      if(!state.draft) state.draft = freshDraft(todayStr());
      state.recordsLoading = false;
      render();
    }, err => { console.error('records listener:', err); state.recordsLoading = false; render(); });
  }

  async function seedDemoRecordsIfEmpty(uidVal){
    const existing = await db.collection('users').doc(uidVal).collection('records').limit(1).get();
    if(!existing.empty) return;
    const pattern = [
      ...Array(5).fill(['menstruacao','molhada']),
      ...Array(4).fill(['nenhum','seca']),
      ...Array(2).fill(['pegajoso','umida']),
      ...Array(3).fill(['elastico','lubrificativa']), // pico = último desses
      ...Array(1).fill(['cremoso','molhada']),
      ...Array(1).fill(['pegajoso','umida']),
      ...Array(1).fill(['nenhum','seca']),
      ...Array(9).fill(['nenhum','seca']),
    ];
    const total = 34; // termina ontem
    const start = addDays(todayStr(), -total);
    const batch = db.batch();
    const col = db.collection('users').doc(uidVal).collection('records');
    for(let i=0;i<total;i++){
      const [muco, sensacao] = pattern[i % pattern.length];
      const date = addDays(start, i);
      const rec = {
        date,
        sensacao: muco==='menstruacao' ? 'molhada' : sensacao,
        muco: muco==='menstruacao' ? 'nenhum' : muco,
        sangramento: muco === 'menstruacao' ? 'menstruacao' : (Math.random()<0.03 ? 'leve':'nenhum'),
        fatores: (i===12 ? ['relacao'] : (i===2 ? ['estresse'] : [])),
        notas: (i===12 ? 'Sensação de lubrificação nítida ao longo do dia.' : ''),
      };
      batch.set(col.doc(date), rec);
    }
    await batch.commit();
  }

    };

  /* ---------------------------------------------------------------------
     REGRAS DE NEGÓCIO — MÉTODO BILLINGS
  --------------------------------------------------------------------- */
  function isFertileMucus(r){ return r.muco==='elastico' || r.sensacao==='lubrificativa'; }

  function baseClassify(r){
    if(r.personalBIP) return { color:'green', label:'Padrão Básico Pessoal', code:'B', desc:'Marcado manualmente como seu padrão básico infértil pessoal (fases especiais como amamentação/perimenopausa).' };
    if(r.sangramento === 'menstruacao') return { color:'red', label:'Menstruação', code:'M', desc:'Sangramento menstrual — dia de alto risco por convenção do método.' };
    if(r.sangramento === 'leve')        return { color:'amber', label:'Spotting', code:'X', desc:'Sangramento leve fora do período — requer atenção.' };
    if(isFertileMucus(r))               return { color:'red', label:'Muco fértil', code:'F', desc:'Muco elástico/transparente ou sensação lubrificativa: padrão de alta fertilidade.' };
    if(r.muco==='cremoso' || r.sensacao==='molhada') return { color:'amber', label:'Transição', code:'C', desc:'Muco em transição — observar evolução.' };
    if(r.muco==='pegajoso')             return { color:'amber', label:'Pegajoso/opaco', code:'P', desc:'Muco pegajoso e opaco — fase de transição.' };
    if((r.muco==='nenhum'||!r.muco) && r.sensacao==='seca') return { color:'green', label:'Padrão infértil básico', code:'S', desc:'Sensação seca, sem muco — padrão infértil básico (PBI).' };
    return { color:'amber', label:'A observar', code:'?', desc:'Registro sem padrão claro — observe nos próximos dias.' };
  }

  // Agrupa por ciclos (início de ciclo = primeiro dia de menstruação),
  // identifica o Ápice (último dia de muco fértil antes do declínio, ou o
  // dia marcado manualmente como Ápice) e aplica a Regra dos 3 dias.
  // Também aplica o "dia de espera": um dia após relação sexual registrada
  // fora do padrão básico infértil vira cauteloso, pois a observação do
  // muco pode ter sido mascarada pelo fluido seminal.
  function computeAnalysis(records){
    const sorted = [...records].sort((a,b)=> a.date < b.date ? -1 : 1);
    const cycles = [];
    let current = [];
    sorted.forEach((r,idx)=>{
      const prev = sorted[idx-1];
      const startsNewCycle = r.sangramento==='menstruacao' && (!prev || prev.sangramento!=='menstruacao');
      if(startsNewCycle && current.length){ cycles.push(current); current=[]; }
      current.push(r);
    });
    if(current.length) cycles.push(current);

    const analyzed = [];
    cycles.forEach(cycle=>{
      const base = cycle.map(r=>({ rec:r, ...baseClassify(r) }));

      // Ápice: usa marcação manual se existir; senão, detecta automaticamente
      // como o último dia de muco fértil do ciclo.
      let peakIdx = -1;
      let manualPeakIdx = base.findIndex(b=>b.rec.manualPeak);
      if(manualPeakIdx > -1){
        peakIdx = manualPeakIdx;
      } else {
        base.forEach((b,i)=>{ if(isFertileMucus(b.rec)) peakIdx = i; });
      }

      const entries = base.map((b,i)=>({ ...b, isPeak:false, postPeakDay:0, waitDay:false, cycleDay: dayDiff(cycle[0].date, b.rec.date)+1 }));

      entries.forEach((entry,i)=>{
        if(peakIdx>-1 && i===peakIdx){
          entry.isPeak = true;
          entry.label = manualPeakIdx>-1 ? 'Ápice (marcado manualmente)' : 'Ápice (pico de fertilidade)';
          entry.code = 'ÁPICE';
          entry.color = 'red';
          entry.desc = manualPeakIdx>-1 ? 'Dia marcado manualmente como Ápice.' : 'Último dia do padrão de muco mais fértil do ciclo — identificado automaticamente.';
        } else if(peakIdx>-1 && i>peakIdx && i<=peakIdx+3){
          const day = i - peakIdx;
          entry.postPeakDay = day;
          if(entry.rec.sangramento!=='menstruacao'){
            entry.color = 'amber';
            entry.label = `Regra dos 3 dias (+${day})`;
            entry.code = String(day);
            entry.desc = 'Dentro dos 3 dias após o Ápice — considerado fértil por segurança do método.';
          }
        }
      });

      // Dia de espera: o dia seguinte a uma relação registrada em dia não-verde
      // (fora do padrão básico infértil) fica cauteloso, pois fluido seminal
      // pode mascarar a observação do muco.
      entries.forEach((entry,i)=>{
        const prev = entries[i-1];
        if(prev && prev.rec.fatores && prev.rec.fatores.includes('relacao') && prev.color!=='green' && entry.color==='green'){
          entry.waitDay = true;
          entry.color = 'amber';
          entry.label = 'Dia de espera (observação após relação)';
          entry.code = 'E';
          entry.desc = 'Relação registrada fora do padrão básico infértil no dia anterior — observação de hoje pode estar mascarada.';
        }
      });

      entries.forEach(e=>analyzed.push(e));
    });
    return analyzed; // ordenado por data asc
  }

  function fertilityMessage(entry){
    if(!entry) return { title:'Sem registro hoje', desc:'Registre a observação de hoje para ver sua classificação.', color:'muted' };
    if(entry.color==='red') return { title:'Alta probabilidade de fertilidade', desc:'Evite relações desprotegidas se o objetivo é espaçamento gestacional.', color:'red' };
    if(entry.color==='amber') return { title:'Fase de transição / cautela', desc:'Padrão em mudança — mantenha atenção redobrada nas próximas observações.', color:'amber' };
    return { title:'Baixa probabilidade de fertilidade', desc:'Padrão infértil básico identificado — menor risco para espaçamento.', color:'green' };
  }

  // Estatísticas por ciclo (duração, dia do Ápice, duração da fase lútea)
  // e um alerta gentil — nunca diagnóstico — quando o padrão foge do comum.
  function computeCycleStats(records){
    const analysis = computeAnalysis(records);
    if(analysis.length===0) return null;

    const cyclesMap = [];
    let currentCycle = [];
    let currentStart = null;
    analysis.forEach((e,i)=>{
      const prev = analysis[i-1];
      const startsNew = e.rec.sangramento==='menstruacao' && (!prev || prev.rec.sangramento!=='menstruacao');
      if(startsNew && currentCycle.length){ cyclesMap.push({ start:currentStart, entries:currentCycle }); currentCycle=[]; }
      if(startsNew || !currentStart) currentStart = e.rec.date;
      currentCycle.push(e);
    });
    if(currentCycle.length) cyclesMap.push({ start:currentStart, entries:currentCycle });

    const completedCycles = cyclesMap.slice(0, -1); // último pode estar em andamento
    const lengths = [];
    const peakDays = [];
    const lutealLengths = [];
    completedCycles.forEach((c,i)=>{
      const next = cyclesMap[i+1];
      if(next) lengths.push(dayDiff(c.start, next.start));
      const peak = c.entries.find(e=>e.isPeak);
      if(peak){
        peakDays.push(peak.cycleDay);
        if(next) lutealLengths.push(dayDiff(peak.rec.date, next.start));
      }
    });

    const avg = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : null;

    // Alerta de padrão atípico: ciclo em andamento muito longo sem Ápice identificado.
    const openCycle = cyclesMap[cyclesMap.length-1];
    const openCycleDay = openCycle ? dayDiff(openCycle.start, todayStr())+1 : 0;
    const openHasPeak = openCycle ? openCycle.entries.some(e=>e.isPeak) : true;
    const atypical = openCycleDay > 45 && !openHasPeak;

    return {
      totalCycles: cyclesMap.length,
      completedCycles: completedCycles.length,
      avgCycleLength: avg(lengths),
      avgPeakDay: avg(peakDays),
      avgLutealLength: avg(lutealLengths),
      openCycleDay,
      atypical,
    };
  }

  // Monta com new Date(ano, mes-1, dia) de propósito: passar a string direto
  // faria o JS interpretar como UTC e, no fuso do Brasil, exibir o dia anterior.
  function fmtDate(iso){
    try{
      const [a, m, d] = String(iso).split('-').map(Number);
      if(!a || !m || !d) return String(iso);
      return new Date(a, m - 1, d).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });
    }catch(e){ return String(iso); }
  }

    async copyShareLink(shareId){
      const url = `${window.location.origin}/share.html?id=${shareId}`;
      let ok = false;
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(url);
          ok = true;
        }
      }catch(e){ ok = false; }
      if(!ok){
        try{
          const ta = document.createElement('textarea');
          ta.value = url;
          ta.setAttribute('readonly','');
          ta.style.position = 'fixed';
          ta.style.top = '-1000px';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, url.length);
          ok = document.execCommand('copy');
          document.body.removeChild(ta);
        }catch(e){ ok = false; }
      }
      if(ok){
        state.copiedShareId = shareId;
        render();
        setTimeout(()=>{ state.copiedShareId = null; render(); }, 2500);
      } else {
        this.toast('Não consegui copiar. Selecione o link acima e copie manualmente.', 'error');

      state.suggestBusy = true; render();

        state.lastSuggestSent = data;
        state.suggestTarget = null;

      }catch(e){
        const msg = (e && e.code === 'permission-denied')
          ? 'Sem permissão. O link pode ter expirado ou sido revogado.'
          : 'Não foi possível enviar a sugestão agora.';
        this.toast(msg, 'error');

    async aprovarSugestao(sugId){

      if(!sug) return;
      try{
        const existente = (state.records||[]).find(r=>r.date===sug.date);

        });

        this.toast('Sugestão aprovada e registrada.', 'success');

    /* ---------- REGISTRO DE ERROS (beta) ---------- */
    buildErrorReport(){
      const log = window.__ERROR_LOG__ || [];
      const env = typeof window.__ENV_INFO__ === 'function' ? window.__ENV_INFO__() : '';
      const lines = [];
      lines.push('===== RELATÓRIO DE ERROS — CICLO CONSCIENTE =====');
      lines.push('');
      lines.push(env);
      lines.push('Aba aberta: ' + state.tab);
      lines.push('Registros carregados: ' + ((state.records||[]).length));
      lines.push('Conta: ' + (state.currentUser ? (state.currentUser.isGuest ? 'demonstração' : 'e-mail/senha') : 'não logada'));
      lines.push('');
      lines.push('----- OCORRÊNCIAS (' + log.length + ') -----');
      if(log.length === 0){
        lines.push('(nenhum erro registrado nesta sessão)');
      } else {
        log.forEach(function(e, i){
          lines.push('');
          lines.push('[' + (i+1) + '] ' + e.type + (e.count>1 ? ' (repetiu ' + e.count + 'x)' : ''));
          lines.push('Quando: ' + e.t);
          lines.push('Mensagem: ' + e.msg);
          if(e.detail){
            lines.push('Detalhes:');
            lines.push(e.detail);
          }
        });
      }
      lines.push('');
      lines.push('===== FIM DO RELATÓRIO =====');
      return lines.join('\n');
    },
    async copyErrorLog(){
      const text = this.buildErrorReport();
      let ok = false;
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(text);
          ok = true;
        }
      }catch(e){ ok = false; }
      if(!ok){
        // fallback para navegadores sem Clipboard API (ou http)
        try{
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly','');
          ta.style.position = 'fixed';
          ta.style.top = '-1000px';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, text.length);
          ok = document.execCommand('copy');
          document.body.removeChild(ta);
        }catch(e){ ok = false; }
      }
      if(ok){
        state.errorCopied = true;
        render();
        setTimeout(function(){ state.errorCopied = false; render(); }, 2500);
        this.toast('Relatório copiado. Agora é só colar.', 'success');
      } else {
        this.toast('Não consegui copiar. Selecione o texto dos cartões manualmente.', 'error');
      }
    },
    clearErrorLog(){
      const log = window.__ERROR_LOG__;
      if(log) log.length = 0;
      state.errorCopied = false;
      render();
      this.toast('Registro de erros limpo.', 'info');
    },

    /* ---------- COMPARTILHAMENTO (instrutora / esposo) ---------- */
    async loadShares(){
      if(state.currentUser.isGuest) return;
      state.sharesLoading = true; render();
      try{
        const snap = await db.collection('shares').where('ownerUid','==', state.currentUser.id).get();
        const now = Date.now();
        state.shares = snap.docs
          .map(d=>({ id:d.id, ...d.data() }))
          .filter(s=> s.expiresAt && s.expiresAt.toMillis() > now)
          .sort((a,b)=> b.createdAt.toMillis() - a.createdAt.toMillis());
      }catch(e){
        state.shares = [];
      }
      state.sharesLoading = false; render();
    },
    async createShareLink(){
      // limites simples anti-abuso: no máximo 5 links ativos, e um intervalo
      // mínimo entre criações (evita gerar dezenas de links em segundos)
      const active = state.shares || [];
      if(active.length >= 5){
        this.toast('Limite de 5 links ativos atingido. Revogue um antes de criar outro.', 'error');
        return;
      }
      const lastCreated = active.reduce((max,s)=> s.createdAt && s.createdAt.toMillis() > max ? s.createdAt.toMillis() : max, 0);
      if(lastCreated && (Date.now() - lastCreated) < 60000){
        this.toast('Aguarde um minuto antes de gerar outro link.', 'error');
        return;
      }

      state.shareBusy = true; render();
      try{
        const expiresAt = firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 30*24*60*60*1000));
        const ref = await db.collection('shares').add({
          ownerUid: state.currentUser.id,
          ownerName: state.currentUser.name,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          expiresAt,
        });
        // Não tentamos copiar aqui: depois do await no Firestore o iPhone já
        // não considera isso um gesto do usuário e bloqueia a área de
        // transferência. O link aparece na lista com botão de copiar próprio.
        this.toast('Link criado! Use o botão Copiar abaixo.', 'success');
        await this.loadShares();
      }catch(e){
        this.toast('Não foi possível gerar o link agora.', 'error');
        state.shareBusy = false; render();
      }
      state.shareBusy = false; render();
    },
    async revokeShare(shareId){
      try{
        // Apagar só o share não bastaria: quem já resgatou o link teria um
        // grant ativo e continuaria enxergando os registros. Os grants
        // derivados deste link precisam cair junto.
        try{
          const grantsSnap = await db.collection('grants')
            .where('ownerUid','==', state.currentUser.id)
            .where('shareId','==', shareId)
            .get();
          await Promise.all(grantsSnap.docs.map(d => d.ref.delete()));
        }catch(e){ /* segue para apagar o share mesmo assim */ }

        await db.collection('shares').doc(shareId).delete();
        this.toast('Compartilhamento revogado.', 'info');
        await this.loadShares();
      }catch(e){
        this.toast('Não foi possível revogar agora.', 'error');
      }
    },

    async addStudentByCode(ev){
      ev.preventDefault();
      const fd = new FormData(ev.target);
      let code = (fd.get('code')||'').trim();
      // aceita tanto o link inteiro quanto só o id
      const match = code.match(/[?&]id=([^&]+)/);
      if(match) code = match[1];
      if(!code){ this.toast('Cole o código ou link que a aluna te enviou.', 'error'); return; }

      if(state.currentUser.isGuest){
        this.toast('Entre com uma conta de e-mail e senha para vincular.', 'error');
        return;
      }

      state.addStudentBusy = true; render();
      try{
        // 1. Lê o link compartilhado. O shareId é o próprio token de acesso.
        const shareSnap = await db.collection('shares').doc(code).get();
        if(!shareSnap.exists) throw new Error('Código inválido. Confira se copiou o link inteiro.');

        const share = shareSnap.data();
        if(share.expiresAt && share.expiresAt.toMillis() < Date.now()){
          throw new Error('Este link expirou. Peça um novo à aluna.');
        }
        if(share.ownerUid === state.currentUser.id){
          throw new Error('Este é o seu próprio link de compartilhamento.');
        }

        // 2. Cria a permissão de leitura. As Regras do Firestore revalidam o
        //    share (existe? é desta dona? está no prazo?) — o app não é a
        //    única barreira.
        const grantId = `${share.ownerUid}_${state.currentUser.id}`;
        await db.collection('grants').doc(grantId).set({
          ownerUid: share.ownerUid,
          readerUid: state.currentUser.id,
          shareId: code,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });

        // 3. Guarda na lista da instrutora (cache do nome, para exibição).
        await db.collection('instructors').doc(state.currentUser.id).collection('students').doc(code).set({
          shareId: code,
          ownerUid: share.ownerUid,
          studentName: share.ownerName || 'Aluna',
          addedAt: firebase.firestore.FieldValue.serverTimestamp(),
        });

        this.toast('Aluna vinculada com sucesso!', 'success');
        ev.target.reset();
        await this.loadLinkedStudents();
      }catch(e){
        const msg = (e && e.code === 'permission-denied')
          ? 'Link inválido, expirado ou revogado pela aluna.'
          : (e.message || 'Não foi possível vincular agora.');
        this.toast(msg, 'error');
      }
      state.addStudentBusy = false; render();
    },
    async removeStudent(shareId){
      try{
        const entry = (state.linkedStudents || []).find(s => s.id === shareId || s.shareId === shareId);
        const ownerUid = entry && entry.ownerUid;

        // Apaga a permissão de leitura primeiro — se só removêssemos da lista,
        // o acesso aos registros continuaria valendo nas regras do Firestore.
        if(ownerUid){
          try{
            await db.collection('grants').doc(`${ownerUid}_${state.currentUser.id}`).delete();
          }catch(e){ /* já pode ter sido revogado pela aluna */ }
        }

        await db.collection('instructors').doc(state.currentUser.id).collection('students').doc(shareId).delete();
        this.toast('Aluna desvinculada.', 'info');
        await this.loadLinkedStudents();
      }catch(e){
        this.toast('Não foi possível desvincular agora.', 'error');
      }
    },
    async openStudentChart(shareId){

      try{
        // Descobre de quem é este vínculo. Vínculos antigos (criados na versão

        // no próprio share.
        const entry = (state.linkedStudents || []).find(s => s.id === shareId || s.shareId === shareId);

          : (e.message || 'Não foi possível abrir este gráfico.');

    closeDeleteConfirm(){ state.deleteConfirmOpen = false; state.deletePassword = ''; render(); },
    setDeletePassword(v){ state.deletePassword = v; },
    async confirmDeleteAccount(){
      // Lê a senha direto do campo (o valor é mantido sem re-render para não
      // destruir o input enquanto a pessoa digita).
      try{
        const inp = document.getElementById('inputSenhaExcluir');
        if(inp) state.deletePassword = inp.value;
      }catch(e){}

      const user = auth.currentUser;
      if(!user){ this.toast('Sessão expirada. Entre novamente.', 'error'); return; }

      const ehAnonimo = user.isAnonymous;
      if(!ehAnonimo && !state.deletePassword){
        this.toast('Digite sua senha para confirmar a exclusão.', 'error');
        return;
      }

      state.deleteBusy = true; render();
      try{
        // PASSO 1 — Reautenticar ANTES de apagar qualquer coisa.
        // A ordem importa: se a reautenticação falhasse depois de apagar os
        // registros, a pessoa ficaria sem os dados E com a conta ainda ativa.
        if(!ehAnonimo){
          const cred = firebase.auth.EmailAuthProvider.credential(user.email, state.deletePassword);
          await user.reauthenticateWithCredential(cred);
        }

        // PASSO 2 — Só agora apaga os dados. A partir daqui a exclusão da
        // conta não deve mais falhar por credencial antiga.
        const uidVal = state.currentUser.id;
        const col = db.collection('users').doc(uidVal).collection('records');
        let snap = await col.limit(400).get();
        while(!snap.empty){
          const batch = db.batch();
          snap.docs.forEach(d=>batch.delete(d.ref));
          await batch.commit();
          snap = await col.limit(400).get();
        }
        await db.collection('users').doc(uidVal).delete();

        // PASSO 3 — Remove a conta de autenticação.
        await auth.currentUser.delete();
        // onAuthStateChanged cuida de limpar o estado e voltar ao login
      }catch(e){
        let msg = 'Não foi possível excluir a conta agora.';
        if(e && (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential')){
          msg = 'Senha incorreta. Nenhum dado foi apagado.';
        } else if(e && e.code === 'auth/too-many-requests'){
          msg = 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
        } else if(e && e.code === 'auth/requires-recent-login'){
          msg = 'Sessão antiga. Saia, entre novamente e repita a exclusão.';
        }
        this.toast(msg, 'error');
        if(window.__LOG_ERROR__) window.__LOG_ERROR__('excluir-conta', msg, 'code: ' + ((e && e.code) || 'sem código'));
        state.deleteBusy = false; state.deletePassword = ''; render();
      }
    },

    /* ---------- GUIA ---------- */
    toggleGuide(){ state.guideOpen = !state.guideOpen; render(); },

    /* ---------- ONBOARDING ---------- */
    nextOnboardingStep(){
      if(state.onboardingStep >= 3){ this.finishOnboarding(); return; }
      state.onboardingStep++; render();
    },
    prevOnboardingStep(){ if(state.onboardingStep>0){ state.onboardingStep--; render(); } },
    async finishOnboarding(){
      state.showOnboarding = false; render();
      try{ await db.collection('users').doc(state.currentUser.id).update({ onboardingSeen:true }); }catch(e){}
    },

    /* ---------- EXPORTAÇÃO PDF (premium) ---------- */
    exportReport(){
      if(!hasPremium(state.currentUser)){ this.openPaywall('pdf'); return; }
      try{
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const analysis = computeAnalysis(state.records || []);
        const rgb = { red:[179,70,50], amber:[184,128,42], green:[76,122,87] };
        let y = 18;
        doc.setFont('helvetica','bold'); doc.setFontSize(16);
        doc.text('Relatório de Acompanhamento — Método Billings', 14, y); y+=8;
        doc.setFont('helvetica','normal'); doc.setFontSize(10);
        doc.text(`Usuária: ${state.currentUser.name}   |   Gerado em: ${fmtBRFull(todayStr())}`, 14, y); y+=10;
        doc.setDrawColor(200); doc.line(14,y,196,y); y+=9;

        doc.setFont('helvetica','bold'); doc.setFontSize(11);
        doc.text('Data', 26, y); doc.text('Classificação', 52, y); doc.text('Sensação/Muco', 118, y); doc.text('Obs.', 168, y);
        y += 5; doc.setDrawColor(230); doc.line(14,y,196,y); y+=6;
        doc.setFont('helvetica','normal'); doc.setFontSize(9);

        analysis.forEach(e=>{
          if(y>282){ doc.addPage(); y=18; }
          // estampa colorida, imitando o carimbo clássico do gráfico Billings
          const [r,g,b] = rgb[e.color] || rgb.amber;
          doc.setFillColor(r,g,b);
          doc.circle(17, y-1.5, 3.2, 'F');
          doc.setTextColor(255,255,255); doc.setFontSize(6);
          doc.text(String(e.code).slice(0,2), 17, y-0.2, { align:'center' });
          doc.setTextColor(20,20,20); doc.setFontSize(9);

          doc.text(fmtBRFull(e.rec.date), 26, y);
          doc.text(String(e.label).slice(0,24) + (e.isPeak?' 🌸':''), 52, y);
          doc.text(`${label(SENSACAO_OPTIONS,e.rec.sensacao)} / ${label(MUCUS_OPTIONS,e.rec.muco)}`.slice(0,32), 118, y);
          doc.text((e.rec.notas||'-').slice(0,16), 168, y);
          y += 7.5;
        });

        // legenda de cores
        if(y>260){ doc.addPage(); y=18; } else { y += 6; }
        doc.setDrawColor(230); doc.line(14,y,196,y); y+=8;
        doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text('Legenda', 14, y); y+=7;
        doc.setFont('helvetica','normal'); doc.setFontSize(8);
        [['red','Fértil / Ápice / Regra dos 3 dias'],['amber','Transição / cautela'],['green','Infértil (Padrão Básico)']].forEach(([c,txt])=>{
          const [r,g,b] = rgb[c];
          doc.setFillColor(r,g,b); doc.circle(17, y-1.2, 2.6, 'F');
          doc.setTextColor(20,20,20); doc.text(txt, 24, y);
          y += 6;
        });

        doc.save(`relatorio-billings-${todayStr()}.pdf`);
        this.toast('Relatório PDF exportado.', 'success');
      }catch(e){
        this.toast('Não foi possível gerar o PDF neste navegador.', 'error');
      }
    },

    /* ---------- TOAST ---------- */
    toast(msg, type){
      // Toasts de erro/aviso também entram no relatório da aba Erros — sem
      // isso, um erro tratado com try/catch (ex: recurso não configurado)
      // nunca aparecia no log, mesmo sendo um problema real pra usuária.
      if((type==='error' || type==='warn') && window.__LOG_ERROR__){
        window.__LOG_ERROR__('toast.' + type, msg, 'Aba ativa: ' + state.tab);
      }
      state.toast = { msg, type: type||'info', id: uid() };
      render();
      const myId = state.toast.id;
      setTimeout(()=>{ if(state.toast && state.toast.id===myId){ state.toast=null; render(); } }, 2600);
    },
  };
  window.App = App;

  /* ---------- DASHBOARD ---------- */
  function renderDashboard(){

    const cycleDay = lastPeriodStart ? dayDiff(lastPeriodStart.date, todayStr())+1 : null;
    const ringPct = cycleDay ? Math.min(cycleDay/28,1) : 0;
    const circumference = 2*Math.PI*42;

        <div class="flex items-center justify-between mb-3">
          <p class="text-xs font-semibold text-muted uppercase tracking-wide">Últimos 7 dias</p>
          <span class="text-[10px] text-muted">Plano Grátis</span>

            <div class="flex flex-col items-center gap-1.5">
              <div class="w-8 h-8 rounded-full ${colorClasses[e.color].dot} flex items-center justify-center text-white text-[10px] font-bold font-mono">${e.code}</div>

  /* ---------- CALENDÁRIO VISUAL ---------- */
  function renderCalendarView(analysisDesc){
    const analysis = analysisDesc.slice().reverse(); // volta pra ordem asc
    if(analysis.length===0) return `<p class="text-xs text-muted py-4 text-center">Nenhum registro ainda.</p>`;

    const byDate = {};
    analysis.forEach(e=>{ byDate[e.rec.date] = e; });

    const months = [];
    const seen = new Set();
    analysis.forEach(e=>{
      const key = e.rec.date.slice(0,7); // YYYY-MM
      if(!seen.has(key)){ seen.add(key); months.push(key); }
    });

    const weekDays = ['D','S','T','Q','Q','S','S'];

    return months.slice().reverse().map(monthKey=>{
      const [year, month] = monthKey.split('-').map(Number);
      const firstOfMonth = new Date(year, month-1, 1);
      const daysInMonth = new Date(year, month, 0).getDate();
      const startOffset = firstOfMonth.getDay(); // 0=domingo
      const monthLabel = firstOfMonth.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });

      let cells = '';
      for(let i=0;i<startOffset;i++){ cells += `<div></div>`; }
      for(let d=1; d<=daysInMonth; d++){
        const dateStr = `${year}-${pad(month)}-${pad(d)}`;
        const e = byDate[dateStr];
        if(e){
          cells += `<button onclick="App.editDate('${dateStr}')" class="tap aspect-square rounded-lg ${colorClasses[e.color].dot} text-white text-[9px] font-bold font-mono flex items-center justify-center ${e.isPeak?'ring-2 ring-offset-1 ring-primary':''}">${d}</button>`;
        } else {
          cells += `<div class="aspect-square rounded-lg bg-primary-soft/40 text-muted text-[9px] font-mono flex items-center justify-center">${d}</div>`;
        }
      }

      return `
      <div class="mb-4 last:mb-0">
        <p class="text-xs font-semibold text-ink capitalize mb-2">${monthLabel}</p>
        <div class="grid grid-cols-7 gap-1 mb-1">
          ${weekDays.map(w=>`<div class="text-center text-[9px] text-muted font-semibold">${w}</div>`).join('')}
        </div>
        <div class="grid grid-cols-7 gap-1">${cells}</div>
      </div>`;
    }).join('');
  }

        <button onclick="App.fecharSugestao()" class="tap text-muted shrink-0">${icon('x','w-4 h-4')}</button>
      </div>
      <p class="text-[11px] text-muted leading-relaxed mb-3">Preencha <strong>conforme ela relatou</strong>. A observação é dela &mdash; você está apenas transcrevendo. Ela recebe a sugestão e decide se entra no gráfico.</p>

      <form onsubmit="return App.enviarSugestao(event)" class="space-y-3">
        <div>
          <label class="text-[10px] font-semibold text-muted uppercase tracking-wide">Dia</label>
          <input name="data" type="date" value="${todayStr()}" max="${todayStr()}" required
            class="mt-1 w-full border border-primary/15 rounded-xl px-3 py-2.5 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-primary/40">
        </div>
        <div>
          <label class="text-[10px] font-semibold text-muted uppercase tracking-wide">Sensação que ela descreveu</label>
          <select name="sensacao" required class="mt-1 w-full border border-primary/15 rounded-xl px-3 py-2.5 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-primary/40">
            <option value="">Selecione&hellip;</option>
            ${SENSACAO_OPTIONS.map(o=>`<option value="${o.id}">${esc(o.label)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="text-[10px] font-semibold text-muted uppercase tracking-wide">Muco que ela descreveu</label>
          <select name="muco" required class="mt-1 w-full border border-primary/15 rounded-xl px-3 py-2.5 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-primary/40">
            <option value="">Selecione&hellip;</option>
            ${MUCUS_OPTIONS.map(o=>`<option value="${o.id}">${esc(o.label)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="text-[10px] font-semibold text-muted uppercase tracking-wide">Observação (opcional)</label>
          <textarea name="notas" rows="2" placeholder="Algo que ela mencionou"
            class="mt-1 w-full border border-primary/15 rounded-xl px-3 py-2.5 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-primary/40"></textarea>
        </div>
        <button type="submit" ${state.suggestBusy?'disabled':''} class="tap w-full bg-primary text-white font-semibold py-3 rounded-xl text-sm disabled:opacity-60">
          ${state.suggestBusy ? 'Enviando&hellip;' : 'Enviar para aprovação'}
        </button>
      </form>
    </div>`;
  }

  function renderInstructorAlunas(){
    // 'parceiro' é aceito por compatibilidade com contas criadas antes da
    // troca do rótulo para 'esposo'.
    const ehEsposo = ehPapelEsposo(state.currentUser);
    const quem = ehEsposo ? 'sua esposa' : 'sua aluna';
    return `
    <div class="space-y-5">
      ${state.suggestTarget ? renderFormSugestao() : ''}
      ${(!state.suggestTarget && state.lastSuggestSent) ? `
      <div class="bg-infertil-bg text-infertil rounded-2xl p-4 anim-fadeUp">
        <div class="flex items-start gap-2.5">
          ${icon('check','w-4 h-4 mt-0.5 shrink-0')}
          <div>
            <p class="text-sm font-semibold">Sugestão enviada &mdash; ${esc(fmtDate(state.lastSuggestSent))}</p>
            <p class="text-[11px] mt-1 leading-relaxed">Ela vê no painel dela e decide se aprova. Enquanto isso, nada foi alterado no gráfico.</p>
          </div>
        </div>
      </div>` : ''}
      <div class="bg-white rounded-2xl p-4 shadow-soft anim-fadeUp">
        <p class="text-xs font-semibold text-muted uppercase tracking-wide mb-1">${ehEsposo ? 'Vincular' : 'Vincular nova aluna'}</p>
        <p class="text-[11px] text-muted mb-3 leading-relaxed">Peça para ${quem} gerar um link em Perfil → "Compartilhar com instrutora ou esposo" e cole aqui o link ou o código.</p>
        <form onsubmit="return App.addStudentByCode(event)" class="flex gap-2">
          <input name="code" type="text" required placeholder="Cole o link ou código aqui" class="flex-1 border border-primary/15 rounded-xl px-3 py-2.5 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-primary/40">
          <button type="submit" ${state.addStudentBusy?'disabled':''} class="tap shrink-0 bg-primary text-white font-semibold px-4 rounded-xl text-xs disabled:opacity-60">${state.addStudentBusy?'…':'Vincular'}</button>
        </form>
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-soft anim-fadeUp">
        <p class="text-xs font-semibold text-muted uppercase tracking-wide mb-3">${ehEsposo ? 'Acompanhando' : 'Suas alunas'} (${state.linkedStudents ? state.linkedStudents.length : 0})</p>
        ${state.studentsLoading ? `<p class="text-xs text-muted">Carregando…</p>` : ''}
        ${(state.linkedStudents && state.linkedStudents.length) ? `
        <div class="space-y-2">
          ${state.linkedStudents.map(s=>`
            <div class="flex items-center gap-3 bg-primary-soft/50 rounded-xl px-3 py-2.5">
              <div class="w-9 h-9 rounded-full bg-primary text-white flex items-center justify-center text-xs font-semibold shrink-0">${esc((s.studentName||'A')[0].toUpperCase())}</div>
              <button onclick="App.openStudentChart('${s.id}')" class="tap flex-1 min-w-0 text-left">
                <span class="block text-xs font-semibold truncate">${esc(s.studentName||'Aluna')}</span>
                <span class="block text-[10px] text-primary font-semibold">Ver gráfico →</span>
              </button>
              ${ehEsposo && s.ownerUid ? `
              <button onclick="App.abrirSugestao('${s.ownerUid}','${esc(s.studentName||'')}')" class="tap shrink-0 bg-primary text-white text-[10px] font-semibold px-2.5 py-1.5 rounded-lg">Sugerir</button>` : ''}
              <button onclick="App.removeStudent('${s.id}')" class="tap shrink-0 text-fertil">${icon('trash','w-4 h-4')}</button>
            </div>`).join('')}
        </div>` : (state.studentsLoading ? '' : `<p class="text-xs text-muted text-center py-6">Nenhuma aluna vinculada ainda.</p>`)}
      </div>
      <p class="text-[10px] text-muted text-center leading-relaxed pb-2">Os vínculos seguem a validade do link (30 dias). Se expirar, peça um novo.${ehEsposo ? ' Suas sugestões só entram no gráfico depois que ela aprovar.' : ''}</p>
    </div>`;
  }

  function renderInstructorPerfil(u, initials){
    return `
    <div class="space-y-5">
      <div class="bg-white rounded-2xl p-5 shadow-soft flex items-center gap-4 anim-fadeUp">
        <div class="w-14 h-14 rounded-full bg-primary text-white flex items-center justify-center font-display text-xl shrink-0">${initials}</div>
        <div class="min-w-0">
          <p class="font-semibold truncate">${esc(u.name)}</p>
          <p class="text-xs text-muted truncate">${esc(u.email)}</p>
          <span class="inline-block mt-1.5 text-[10px] font-semibold px-2.5 py-1 rounded-full bg-primary-soft text-primary">${ehPapelEsposo(u) ? 'Conta de esposo' : 'Conta de instrutora'}</span>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-soft anim-fadeUp">
        <p class="text-xs font-semibold text-muted uppercase tracking-wide mb-3">Seus dados (LGPD)</p>
        <a href="/privacy.html" target="_blank" class="w-full flex items-center gap-2.5 text-sm font-semibold text-primary py-2">${icon('book','w-4 h-4')} Política de Privacidade</a>
      </div>
      <button onclick="App.logout()" class="tap w-full bg-white border border-primary/15 text-primary font-semibold py-3.5 rounded-xl shadow-soft flex items-center justify-center gap-2 anim-fadeUp">
        ${icon('logout','w-4 h-4')} Sair da conta
      </button>
      <button onclick="App.openDeleteConfirm()" class="tap w-full bg-white border border-fertil/20 text-fertil font-semibold py-3.5 rounded-xl shadow-soft flex items-center justify-center gap-2 anim-fadeUp">
        ${icon('trash','w-4 h-4')} Excluir minha conta
      </button>
    </div>`;
  }

  function renderStudentChartModal(){
    const s = state.viewingStudent;
    return `
    <div class="absolute inset-0 z-40 flex items-end">
      <div class="absolute inset-0 bg-ink/50 anim-fadeIn" onclick="App.closeStudentChart()"></div>
      <div class="relative w-full bg-white rounded-t-[2rem] p-6 pb-8 anim-sheet safe-bottom max-h-[85vh] overflow-y-auto">
        <div class="w-10 h-1.5 bg-primary/15 rounded-full mx-auto mb-5"></div>
        ${state.viewingStudentLoading ? `
        <div class="flex flex-col items-center gap-3 py-10">
          <div class="w-8 h-8 rounded-full border-2 border-primary/20 border-t-primary animate-spin"></div>
          <p class="text-xs text-muted">Carregando gráfico…</p>
        </div>` : s && s.analysis ? `
        <h3 class="font-display text-xl mb-4">${esc(s.name)}</h3>
        <div class="space-y-1.5">
          ${s.analysis.map(e=>`
            <div class="flex items-center gap-3 py-1.5">
              <span class="w-8 h-8 rounded-full ${colorClasses[e.color].dot} text-white flex items-center justify-center text-[10px] font-bold font-mono shrink-0 ${e.isPeak?'ring-2 ring-offset-2 ring-primary':''}">${e.code}</span>
              <span class="flex-1 min-w-0">
                <span class="block text-xs font-semibold truncate">${e.label} ${e.isPeak?'🌸':''}</span>
                <span class="block text-[10px] text-muted font-mono">Dia ${e.cycleDay} · ${fmtBRFull(e.rec.date)}</span>
              </span>
            </div>`).join('')}
          ${s.analysis.length===0 ? `<p class="text-xs text-muted text-center py-6">Nenhum registro ainda.</p>` : ''}
        </div>
        ` : `<p class="text-xs text-muted text-center py-10">Não foi possível carregar este gráfico.</p>`}
        <button onclick="App.closeStudentChart()" class="tap w-full text-muted font-medium py-2 text-sm mt-4">Fechar</button>
      </div>
    </div>`;
  }

  /* ---------------------------------------------------------------------
     ROOT RENDER
  --------------------------------------------------------------------- */
  function render(){
    const root = document.getElementById('app');
    if(state.view==='setup') root.innerHTML = renderSetup();
    else if(state.view==='loading') root.innerHTML = renderLoading();
    else if(state.view==='auth') root.innerHTML = renderAuth();
    // Guarda contra corrida: login já confirmado (view='app') mas o documento
    // do Firestore ainda não chegou (state.currentUser === null). Sem este
    // guarda, renderShell() tenta ler propriedades de 'null' e quebra.
    else if(state.view==='app' && !state.currentUser) root.innerHTML = renderLoading();
    else if(state.currentUser && (state.currentUser.role==='instrutora' || ehPapelEsposo(state.currentUser))) root.innerHTML = renderInstructorShell();
    else root.innerHTML = renderShell();
  }

  /* Redesenha o badge da aba Erros quando um novo erro é capturado.
     Não redesenha se a pessoa está digitando, para não perder o foco. */
  if(window.__ERROR_LISTENERS__){
    let pending = null;
    window.__ERROR_LISTENERS__.push(function(){
      if(pending) return;
      pending = setTimeout(function(){
        pending = null;
        try{
          const el = document.activeElement;
          const typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
          if(!typing && state.view === 'app') render();
        }catch(e){}
      }, 400);
    });
  }

  document.addEventListener('DOMContentLoaded', () => App.init());
})();
</script>
</body>
</html>
